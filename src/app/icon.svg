<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003441" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Air Pulse Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Wind Wave Circulation Vortex -->
  <path d="M 16 26 C 22 18, 38 18, 44 24 C 48 28, 48 36, 42 40 C 36 44, 26 42, 22 36 C 19 32, 21 26, 26 24 C 30 22, 36 24, 38 28 C 39 31, 38 34, 35 35" 
        fill="none" 
        stroke="url(#windGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Center Clean Air Particle Beacon -->
  <circle cx="34" cy="32" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="44" cy="24" r="2" fill="#38bdf8" />
  <circle cx="22" cy="36" r="2" fill="#34d399" />
</svg>
